services:
  db:
    image: postgres:15-alpine
    container_name: forgejo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - forgejo_db_data:/var/lib/postgresql/data
    networks:
      - forgejo-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  forgejo:
    image: codeberg.org/forgejo/forgejo:17
    container_name: forgejo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: ${DATABASE_TYPE}
      FORGEJO__database__HOST: db:${DATABASE_PORT}
      FORGEJO__database__NAME: ${DATABASE_NAME}
      FORGEJO__database__USER: ${DATABASE_USER}
      FORGEJO__database__PASSWD: ${DATABASE_PASSWORD}
      FORGEJO__server__ROOT_URL: ${ROOT_URL}
      FORGEJO__server__SSH_DOMAIN: dots.linuxpad.blog
      FORGEJO__server__SSH_PORT: "2222"
      FORGEJO__server__SSH_LISTEN_PORT: "22"
      FORGEJO__lfs__ENABLED: "true"
      FORGEJO__actions__ENABLED: "true"
    volumes:
      - forgejo_data:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "2222:22"
    networks:
      - forgejo-internal
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.dots-http.entrypoints=http"
      - "traefik.http.routers.dots-http.rule=Host(`dots.linuxpad.blog`)"
      - "traefik.http.routers.dots-http.middlewares=redir-https@file"
      - "traefik.http.routers.dots-http.service=noop@internal"
      - "traefik.http.routers.dots-https.entrypoints=https"
      - "traefik.http.routers.dots-https.rule=Host(`dots.linuxpad.blog`)"
      - "traefik.http.routers.dots-https.tls=true"
      - "traefik.http.routers.dots-https.tls.certresolver=le"
      - "traefik.http.routers.dots-https.middlewares=gzip@file"
      - "traefik.http.routers.dots-https.service=dots-backend"
      - "traefik.http.services.dots-backend.loadbalancer.server.port=3000"

  runner:
    image: davbfr/forgejo-runner:12
    container_name: forgejo-runner
    restart: unless-stopped
    depends_on:
      - forgejo
    environment:
      FORGEJO_INSTANCE_URL: ${ROOT_URL}
      FORGEJO_RUNNER_REGISTRATION_TOKEN: ${RUNNER_REGISTRATION_TOKEN}
      FORGEJO_RUNNER_NAME: homelab-runner
      config__runner__capacity: "1"
    volumes:
      - runner_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - traefik

networks:
  forgejo-internal:
    internal: true
  traefik:
    external: true

volumes:
  forgejo_db_data:
  forgejo_data:
  runner_data:
