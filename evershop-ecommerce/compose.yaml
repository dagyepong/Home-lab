services:

  app:
    image: evershop/evershop:latest
    container_name: evershop
    restart: always
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_PASSWORD: postgres
      DB_USER: postgres
      DB_NAME: postgres
    depends_on:
      - database
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.evershop-http.entrypoints=http"
      - "traefik.http.routers.evershop-http.middlewares=redir-https"
      - "traefik.http.routers.evershop-http.rule=Host(`evershop.linuxpad.blog`)"
      - "traefik.http.routers.evershop-http.service=noop@internal"
      - "traefik.http.routers.evershop-https.entrypoints=https"
      - "traefik.http.routers.evershop-https.tls=true"
      - "traefik.http.routers.evershop-https.middlewares=gzip"
      - "traefik.http.routers.evershop-https.rule=Host(`evershop.linuxpad.blog`)"
      - "traefik.http.services.evershop-backend.loadbalancer.server.scheme=http"
      - "traefik.http.services.evershop-backend.loadbalancer.server.port=3000"
      - "traefik.http.routers.evershop-https.middlewares=authelia@docker"

  database:
    image: postgres:18-alpine
    container_name: evershop-db
    restart: unless-stopped
    volumes:
      - ${DOCKER_VOLUME_STORAGE:-/mnt/docker-volumes}/evershop/psqldata:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    expose:
      - 5432
    #networks:
    #  - proxy

networks:
  traefik:
    name: traefik
    external: true 