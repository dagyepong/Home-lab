services:
  docktail:
    image: ghcr.io/marvinvr/docktail:latest
    container_name: docktail-socketproxy
    depends_on:
      - socket-proxy
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
      - TAILSCALE_OAUTH_CLIENT_ID=${TAILSCALE_OAUTH_CLIENT_ID}
      - TAILSCALE_OAUTH_CLIENT_SECRET=${TAILSCALE_OAUTH_CLIENT_SECRET}
      - DEFAULT_SERVICE_TAGS=tag:docktail-service
    volumes:
      - /var/run/tailscale:/var/run/tailscale
    networks:
      - default
      - docker-api
      - traefik
    restart: unless-stopped

  it-tools:
    image: ghcr.io/corentinth/it-tools:latest
    container_name: socketproxy-it-tools
    labels:
      - docktail.service.enable=true
      - docktail.service.name=tools
      - docktail.service.port=80
      - docktail.service.service-port=443
      - "traefik.http.routers.headplane.middlewares=crowdsec@file"

    restart: unless-stopped

  dockhand:
    image: fnsys/dockhand:latest
    container_name: dockhand
    restart: unless-stopped
    labels:
      - docktail.service.enable=true
      - docktail.service.name=dockhand
      - docktail.service.port=3000
      - docktail.service.service-port=443
      - "traefik.http.routers.headplane.middlewares=crowdsec@file"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockhand_data:/app/data

  flare:
    image: soulteary/flare:0.6.15
    restart: always
    # 默认无需添加任何参数，如有特殊需求
    # 可阅读文档 https://github.com/soulteary/docker-flare/blob/main/docs/advanced-startup.md
    command: flare
    labels:
      - docktail.service.enable=true
      - docktail.service.name=flare
      - docktail.service.port=5005
      - docktail.service.service-port=443
      - "traefik.http.routers.headplane.middlewares=crowdsec@file"

    volumes:
      - ./app:/app

  traefik-manager:
    image: ghcr.io/chr0nzz/traefik-manager:latest
    container_name: traefik-manager
    restart: unless-stopped
    environment:
      - COOKIE_SECURE=false
      - TM_TRAEFIK_URL=http://traefik:8080 # <--- Tells Traefik Manager where to reach Traefik's API
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.traefik-manager.rule=Host(`manager.linuxpad.blog`)"
      - "traefik.http.routers.traefik-manager.entrypoints=https"
      - "traefik.http.routers.traefik-manager.tls=true"
      - "traefik.http.services.traefik-manager.loadbalancer.server.port=5000"
      - "traefik.http.routers.headplane.middlewares=crowdsec@file"

      - "docktail.service.enable=true"
      - "docktail.service.name=traefik-manager"
      - "docktail.service.port=5000"
      - "docktail.service.service-port=443"
    volumes:
      - ./config:/app/config
      - ./backups:/app/backups
      - /var/run/docker.sock:/var/run/docker.sock:ro # <--- Optional: helps it inspect Docker providers directly if needed
      ####  When prompted for the Traefik API URL, ensure it points to http://traefik:8080 (since they are both on the shared traefik network).
      #### Traefik Manager URL: traefik-manager.tail9f20b.ts.net

  pwgen:
    container_name: pwgen
    image: jocxfin/pwgen:latest
    environment:
      - NO_API_CHECK=true
    restart: unless-stopped
    labels:
      - docktail.service.enable=true
      - docktail.service.name=pwgen
      - docktail.service.port=5069
      - docktail.service.service-port=443
      - "traefik.http.routers.headplane.middlewares=crowdsec@file"


  picoshare:
    image: mtlynch/picoshare
    environment:
      - PS_SHARED_SECRET=dummypass 
    command: -db /data/store.db
    container_name: socketproxy-picoshare
    labels:
      - docktail.service.enable=true
      - docktail.service.name=picoshare
      - docktail.service.port=4001
      - docktail.service.service-port=443
      - "traefik.http.routers.headplane.middlewares=crowdsec@file"

    restart: unless-stopped
    volumes:
      - ./data:/data
      - picoshare_data:/data

  # ========================
  # Traefik Reverse Proxy
  # ========================
  traefik:
    container_name: ${SERVICE_NAME}
    image: ${DOCKER_IMAGE}
    restart: always
    ports:
      - target: ${SERVICE_HTTP_PORT}
        published: ${SERVICE_HTTP_PORT}
        protocol: tcp
        mode: host
      - target: ${SERVICE_HTTPS_PORT}
        published: ${SERVICE_HTTPS_PORT}
        protocol: tcp
        mode: host
      - target: ${SERVICE_HTTPS_PORT}
        published: ${SERVICE_HTTPS_PORT}
        protocol: udp
        mode: host
    networks:
      - traefik
    command:
      - "--global.sendanonymoususage=false"
      - "--global.checknewversion=false"

      - "--entrypoints.http.address=:${SERVICE_HTTP_PORT}"
      - "--entrypoints.https.address=:${SERVICE_HTTPS_PORT}"
      - "--entrypoints.https.asDefault=true"
      - "--entrypoints.https.http3"
      - "--entrypoints.https.http3.advertisedport=${SERVICE_HTTPS_PORT}"

      - "--api=true"
      - "--api.dashboard=true"
      # Do not enable --api.insecure=true on an exposed server.

      - "--ping=true"
      - "--log.level=INFO"
      - "--log.format=common"

      # CrowdSec needs JSON access logs written to the shared log directory.
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--accesslog.format=json"

      - "--providers.docker=true"
      - "--providers.docker.watch=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.network=traefik"

      - "--providers.file=true"
      - "--providers.file.watch=true"
      - "--providers.file.directory=/etc/traefik/dynamic"

      # Plugin version is independent of the Traefik image version.
      - "--experimental.plugins.bouncer.moduleName=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      - "--experimental.plugins.bouncer.version=v1.8.2"

      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/data/ssl/acme.json"
      - "--certificatesresolvers.le.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--certificatesresolvers.le.acme.dnschallenge.provider=${ACME_PROVIDER}"
      - "--certificatesresolvers.le.acme.dnschallenge.propagation.delayBeforeChecks=30"

    environment:
      TZ: Asia/Shanghai
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/nana/docker/traefik/ssl/:/data/ssl/
      - /home/nana/docker/traefik/logs/:/var/log/traefik/
      - /home/nana/docker/traefik/dynamic:/etc/traefik/dynamic:ro



    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.traefik-dashboard-secure.tls.certresolver=le"
      - "traefik.http.routers.traefik-dashboard-secure.tls.domains[0].main=${DNS_MAIN}"
      - "traefik.http.routers.traefik-dashboard-secure.tls.domains[0].sans=${DNS_LIST}"
      - "traefik.http.routers.traefik-dashboard-secure.tls=true"
      - "traefik.http.routers.traefik-dashboard-secure.entrypoints=https"
      - "traefik.http.routers.traefik-dashboard-secure.rule=Host(`${SERVICE_DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard-secure.service=dashboard@internal"
      - "traefik.http.routers.traefik-dashboard-secure.middlewares=crowdsec@file"
      # Redirect HTTP to HTTPS rather than serving the dashboard over HTTP.
      - "traefik.http.routers.traefik-dashboard-nosecure.entrypoints=http"
      - "traefik.http.routers.traefik-dashboard-nosecure.rule=Host(`${SERVICE_DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard-nosecure.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

      - "traefik.http.routers.traefik-dashboard-api.tls=true"
      - "traefik.http.routers.traefik-dashboard-api.entrypoints=https"
      - "traefik.http.routers.traefik-dashboard-api.rule=Host(`${SERVICE_DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      - "traefik.http.routers.traefik-dashboard-api.service=api@internal"
      # Docktail labels pointing to Traefik's internal API/Dashboard port (8080)
      - "docktail.service.enable=true"
      - "docktail.service.name=traefik"
      - "docktail.service.port=8080"
      - "docktail.service.service-port=443"
      - "docktail.service.network=traefik"

    extra_hosts:
      - "update.traefik.io:127.0.0.1"
      - "collect.traefik.io:127.0.0.1"
      - "stats.g.doubleclick.net:127.0.0.1"
      - "${SERVICE_DOMAIN}:127.0.0.1"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --proxy off localhost:8080/ping || exit 1"]
      interval: 3s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "1m"




  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      COLLECTIONS: crowdsecurity/traefik
    volumes:
      - crowdsec-data:/var/lib/crowdsec/data
      - crowdsec-config:/etc/crowdsec
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.d/traefik.yaml:ro
      - ./logs/:/var/log/traefik/:ro
    networks:
      - traefik
    labels:
      - "traefik.enable=false"


  # ========================
  # Authelia SSO
  # ========================
  authelia:
    image: authelia/authelia
    container_name: authelia
    volumes:
      - /home/nana/docker/authelia/config:/config
    networks:
      - traefik
    security_opt:
      - no-new-privileges:true
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.authelia.rule=Host(`auth.linuxpad.blog`)'
      - 'traefik.http.routers.authelia.entrypoints=https'
      - 'traefik.http.routers.authelia.tls=true'
      - 'traefik.http.middlewares.authelia.forwardAuth.address=http://authelia:9091/api/verify?rd=https://auth.linuxpad.blog'
      - 'traefik.http.middlewares.authelia.forwardAuth.trustForwardHeader=true'
      - 'traefik.http.middlewares.authelia.forwardAuth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email'
      - 'traefik.http.middlewares.authelia.forwardAuth.maxResponseBodySize=10485760'
      - 'traefik.http.middlewares.authelia-basic.forwardAuth.address=http://authelia:9091/api/verify?auth=basic'
      - 'traefik.http.middlewares.authelia-basic.forwardAuth.trustForwardHeader=true'
      - 'traefik.http.middlewares.authelia-basic.forwardAuth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email'
      - 'traefik.http.services.authelia.loadbalancer.server.port=9091'
    ports:
      - 9091:9091
    restart: unless-stopped
    environment:
      - TZ=Europe/London
    healthcheck:
      disable: true

  # ========================
  # Redis (for Authelia)
  # ========================
  redis:
    image: redis:alpine
    container_name: redis
    volumes:
      - /home/nana/docker/authelia/redis:/data
    networks:
      - traefik
    expose:
      - 6379
    restart: unless-stopped
    environment:
      - TZ=Europe/London

  # ========================
  # Docker Socket Proxy
  # ========================
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: socket-proxy
    environment:
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTARTS=1
      - AUTH=1
      - BUILD=1
      - COMMIT=1
      - CONFIGS=1
      - CONTAINERS=1
      - DISABLE_IPV6=1
      - DISTRIBUTION=1
      - EVENTS=1
      - EXEC=1
      - IMAGES=1
      - INFO=1
      - LOG_LEVEL=info
      - NETWORKS=1
      - NODES=1
      - PING=1
      - PLUGINS=1
      - POST=1
      - SECRETS=1
      - SERVICES=1
      - SESSION=1
      - SWARM=1
      - SYSTEM=1
      - TASKS=1
      - TZ=Etc/UTC
      - VERSION=1
      - VOLUMES=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik
      - docker-api
    read_only: true
    tmpfs:
      - /run
    restart: unless-stopped

  filebrowser:
    image: filebrowser/filebrowser:s6
    container_name: socketproxy-filebrowser
    labels:
      - docktail.service.enable=true
      - docktail.service.name=files
      - docktail.service.port=80
      - docktail.service.service-port=443
    volumes:
      - ./files:/srv
      - filebrowser-db:/database
      - filebrowser-config:/config
    restart: unless-stopped

networks:
  docker-api:
    internal: true
  traefik:
    external: true

volumes:
  filebrowser-db:
  filebrowser-config:
  dockhand_data:
  picoshare_data:
  crowdsec-data:
  crowdsec-config:
 