pages:
  - name: Home
    columns:
      - size: full
        widgets:
          - type: search
            search-engine: google
            new-tab: true
          - type: bookmarks
            title: Services
            groups:
              - title: Apps
                links:
                  - title: Actual Budget
                    url: https://budget.example.com
                    icon: di:actual-budget.svg
                  - title: PairDrop
                    url: https://drop.example.com
                    icon: di:pairdrop.png
                  - title: Chat
                    url: https://chat.linuxpad.blog
                    icon: di:matrix.svg
                  - title: OpenCloud
                    url: https://drive.linuxpad.blog
                    icon: mdi:cloud-outline
                  - title: Photos
                    url: https://photos.linuxpad.blog
                    icon: di:immich.svg
                  - title: Hister
                    url: https://hister.linuxpad.blog
                    icon: mdi:magnify
                  - title: Excalidraw
                    url: https://draw.linuxpad.blog
                    icon: di:excalidraw.svg
              - title: Development
                links:
                  - title: Forgejo
                    url: https://git.linuxpad.blog
                    icon: di:forgejo.svg
                  - title: ArgoCD
                    url: https://argocd.linuxpad.blog
                    icon: di:argo-cd.svg
                  - title: Registry
                    url: https://registry.linuxpad.blog
                    icon: di:docker.svg
              - title: Infrastructure
                links:
                  - title: Grafana
                    url: https://grafana.linuxpad.blog
                    icon: di:grafana.svg
                  - title: SSO
                    url: https://auth.linuxpad.blog
                    icon: di:kanidm.svg
                  - title: OpenBao
                    url: https://openbao.linuxpad.blog
                    icon: di:openbao.svg
                  - title: Speedtest
                    url: https://speedtest.linuxpad.blog
                    icon: di:openspeedtest.png
                  - title: ntfy
                    url: https://ntfy.linuxpad.blog
                    icon: di:ntfy.svg
                  - title: Kiali
                    url: https://kiali.linuxpad.blog
                    icon: mdi:graph-outline
                  - title: WireGuard
                    url: https://vpn.linuxpad.blog
                    icon: di:wireguard.svg
          - type: bookmarks
            groups:
              - links:
                  - title: Documentation
                    url: https://homelab.nanaoware.online
                    icon: di:google-docs.svg
                  - title: Public homelab repository
                    url: https://github.com/dagyepong/Home-Lab
                    icon: di:github.svg
                  - title: Cloudflare
                    url: https://dash.cloudflare.com
                    icon: di:cloudflare.svg
                  - title: Open-Wrt One Router
                    url: https://192.168.1.1
                    icon: di:router.svg

  - name: News
    columns:
      - size: full
        widgets:
          - type: group
            widgets:
              - type: hacker-news
                sort-by: best
              - type: lobsters
                tags:
                  - linux
                  - nix
                  - rust
                  - distributed
                  - databases
                  - networking
                  - security
                  - devops
          - type: releases
            title: Homelab releases
            repositories:
              - glanceapp/glance
              - actualbudget/actual
              - immich-app/immich
              - schlagmichdoch/PairDrop
              - opencloud-eu/opencloud
              - asciimoo/hister

branding:
  custom-footer: '<p>Enjoy this homelab? <a href="https://github.com/dagyepong/Home-Lab" target="_blank" rel="noopener noreferrer">Star it on GitHub ↗</a></p>'

