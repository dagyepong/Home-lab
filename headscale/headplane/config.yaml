server:
  host: 0.0.0.0
  port: 3000
  cookie_secret: "REPLACE_WITH_A_RANDOM_32_CHARACTER_SECRET"
  cookie_secure: true

headscale:
  url: https://headscale.linuxpad.blog
  config_path: /etc/headscale/config.yaml
  config_strict: true

integration:
  docker:
    enabled: true
    container_label: "me.tale.headplane.target=headscale"
    socket: "unix:///var/run/docker.sock"
